# Preview Deployment Test
services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: always
    environment:
      # Admin user — created by Docker at init; must match DATABASE_ADMIN_URL credentials
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-journal}
      # App user — created by init script; must match DATABASE_URL credentials
      APP_USER: ${POSTGRES_APP_USER:-app_user}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-app_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init-app-user.sh:/docker-entrypoint-initdb.d/01-init-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_ADMIN_URL=${DATABASE_ADMIN_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - CLIENT_URL=${CLIENT_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - TEST_USER_EMAIL=${TEST_USER_EMAIL}
      - TEST_USER_PWD=${TEST_USER_PWD}
      - WHISPER_URL=${WHISPER_URL:-http://whisper:9000}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-fr}
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Self-hosted speech-to-text. Never exposed publicly: only the server container
  # talks to it, over the internal network. First boot downloads the model (~500MB
  # for `small`), hence the long start_period.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.9.1
    restart: always
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=${WHISPER_MODEL:-small}
      # int8 quantisation: the VPS has no GPU, and float32 would be ~3x slower.
      - ASR_COMPUTE_TYPE=int8
      - ASR_MODEL_PATH=/data/whisper
    volumes:
      - whisper_models:/data/whisper
    # Bounded so a transcription can't starve Postgres or the API on the 4-vCPU host.
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_ENCRYPTION_KEY=${VITE_ENCRYPTION_KEY}
    restart: always
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  whisper_models:
