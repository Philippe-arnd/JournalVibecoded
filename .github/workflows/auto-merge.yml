name: 🤖 Auto-Merge PR

on:
  workflow_run:
    workflows:
      - "✅ PR Validation"
      - "🔒🚀 Security & Performance"
      - "🔒 Dependency Review"
      - "🐳 Docker Validation"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    uses: Philippe-arnd/reusable-workflow-vibecoded/.github/workflows/reusable-auto-merge.yml@main
    with:
      required-checks: |
        ✅ Quick Checks
        🧪 Vitest Tests
        🔒 RLS Tests
        🔑 Secret Detection
        🛡️ Security Scan
        🔎 Review Dependencies for Vulnerabilities
      conditional-checks: |
        📦 Bundle Size
        Build & Test Docker Images
      merge-method: squash
      base-branch: main
      block-label: major-update
      triggering-conclusion: ${{ github.event.workflow_run.conclusion }}
      triggering-branch: ${{ github.event.workflow_run.head_branch }}
      file-issue-on-failure: true
